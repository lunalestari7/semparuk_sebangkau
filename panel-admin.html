<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Semparuk Sebangkau</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        nav { background: #343a40; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background: #bd2130; }
    </style>
</head>
<body>

<script>
// Keamanan: Cek apakah user sudah login
if (sessionStorage.getItem("statusLoginAdmin") !== "AKTIF") {
    alert("Akses Khusus Admin! Silakan login terlebih dahulu.");
    window.location.href = "admin.html";
}
</script>

<nav>
    <h2>Dashboard Panel Admin</h2>
    <button class="btn-logout" onclick="logout()">Logout</button>
</nav>

<div class="container">
    <div class="card">
        <h3>Selamat Datang di Halaman Admin Desa</h3>
        <p>Halaman ini terproteksi password dan hanya dapat diakses oleh Admin Desa Semparuk Sebangkau.</p>
        <hr>
        <p>Data aspirasi dan pengaduan masyarakat akan tersimpan di Google Sheets yang sudah kamu sambungkan.</p>
    </div>
</div>

<script>
function logout() {
    sessionStorage.removeItem("statusLoginAdmin");
    window.location.href = "admin.html";
}
</script>

</body>
</html>
