<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Desa Semparuk Sebangkau</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Cek status login
        if (localStorage.getItem("adminLoggedIn") !== "true") {
            window.location.href = "admin.html";
        }

        function logout() {
            localStorage.removeItem("adminLoggedIn");
            window.location.href = "admin.html";
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        <!-- Header Panel -->
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Dashboard Admin</h1>
            <p class="text-gray-600 mb-4">Kelola data Website Desa Semparuk Sebangkau</p>
            
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-lg transition">
                Logout
            </button>
        </div>

        <!-- Form Tambah / Edit Data -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <h2 class="text-xl font-bold text-gray-800 mb-2">Tambah / Edit Data Informasi</h2>

            <form id="adminForm" class="space-y-4">
                <div>
                    <input type="text" placeholder="Judul" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
                </div>

                <div>
                    <select class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="">Pilih Kategori</option>
                        <option value="pengumuman">Pengumuman</option>
                        <option value="berita">Berita</option>
                        <option value="galeri">Galeri</option>
                    </select>
                </div>

                <div>
                    <textarea placeholder="Deskripsi" rows="4" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>

                <div>
                    <input type="text" placeholder="URL gambar" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2.5 rounded-xl transition">
                        Simpan Data
                    </button>
                    <button type="reset" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-5 py-2.5 rounded-xl transition">
                        Bersihkan
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabel Daftar Pengaduan Warga (Data dari Google Sheets) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xl font-bold text-gray-800">Daftar Pengaduan Masuk</h2>
                <button onclick="loadPengaduan()" class="text-sm bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-semibold px-3 py-1.5 rounded-lg transition">
                    🔄 Refresh Data
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-emerald-700 text-white text-sm">
                            <th class="p-3 rounded-tl-lg">Waktu</th>
                            <th class="p-3">Nama Warga</th>
                            <th class="p-3">Dusun</th>
                            <th class="p-3 rounded-tr-lg">Pesan Pengaduan</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-pengaduan" class="text-sm text-gray-700 divide-y divide-gray-200">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-gray-500">Memuat data pengaduan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script Fetch Data Pengaduan -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz_3VjacBRhT5B_COKgr8c6Ucrc2h7gSb0u32ypwoi2qd3tOidEv5UpzIZSJEb38gfMlQ/exec';

        function loadPengaduan() {
            const tbody = document.getElementById('tabel-pengaduan');
            tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Memuat data terbaru...</td></tr>';

            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    tbody.innerHTML = '';
                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Belum ada pengaduan masuk.</td></tr>';
                        return;
                    }
                    
                    // Iterasi data (mengabaikan baris header)
                    data.slice(1).reverse().forEach(row => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-gray-50';
                        tr.innerHTML = `
                            <td class="p-3 font-mono text-xs text-gray-500">${new Date(row[0]).toLocaleString('id-ID')}</td>
                            <td class="p-3 font-semibold text-gray-800">${row[1] || '-'}</td>
                            <td class="p-3">${row[2] || '-'}</td>
                            <td class="p-3">${row[3] || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">Buka langsung Google Sheets untuk melihat data pengaduan.</td></tr>';
                });
        }

        // Muat data otomatis saat halaman admin dibuka
        window.addEventListener('DOMContentLoaded', loadPengaduan);
    </script>
</body>
</html>
