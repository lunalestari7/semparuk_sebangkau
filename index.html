<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Pengaduan Warga</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Layanan Pengaduan Warga</h1>
            <a href="panel-admin.html" class="text-sm bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded transition font-medium">
                Admin Login
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Hero Section -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 text-center mb-8">
            <h2 class="text-2xl font-bold text-emerald-800 mb-2">Selamat Datang di Portal Pengaduan</h2>
            <p class="text-gray-600 text-sm md:text-base">
                Sampaikan aspirasi, saran, atau laporan pengaduan Anda untuk kemajuan dan kenyamanan desa kita bersama.
            </p>
        </div>

        <!-- Form Pengaduan Warga -->
        <div class="bg-white p-6 md:p-8 rounded-lg shadow-md border border-gray-200">
            <h3 class="text-xl font-bold text-emerald-800 mb-6 text-center border-b pb-3">Formulir Pengaduan Warga</h3>
            
            <form id="form-aspirasi" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" name="nama" required placeholder="Masukkan nama lengkap" class="w-full p-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Dusun</label>
                    <input type="text" name="dusun" required placeholder="Masukkan nama dusun" class="w-full p-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pesan Pengaduan</label>
                    <textarea name="pesan" rows="4" required placeholder="Tuliskan pengaduan atau aspirasi Anda secara rinci" class="w-full p-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>

                <button type="submit" id="btn-submit" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-md font-bold transition duration-200 shadow-sm">
                    Kirim Pengaduan
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-4 text-xs md:text-sm mt-8">
        <p>&copy; Layanan Pengaduan Warga. All Rights Reserved.</p>
    </footer>

    <!-- Script Pengirim ke Google Sheets -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz_3VjacBRhT5B_COKgr8c6Ucrc2h7gSb0u32ypwoi2qd3tOidEv5UpzIZSJEb38gfMlQ/exec';
        const form = document.forms['form-aspirasi'];
        const btnSubmit = document.getElementById('btn-submit');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // Ubah tombol saat proses pengiriman
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Sending...';

            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    alert('Pengaduan berhasil terkirim!');
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = 'Kirim Pengaduan';
                    form.reset();
                })
                .catch(error => {
                    alert('Gagal mengirim pengaduan. Silakan coba lagi.');
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = 'Kirim Pengaduan';
                });
        });
    </script>
</body>
</html>
