<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Semparuk Sebangkau</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-bold"><i class="bi bi-shield-lock me-2"></i>Panel Kelola Admin Desa</span>
      <button class="btn btn-danger btn-sm fw-bold" onclick="logoutAdmin()">
        <i class="bi bi-box-arrow-right me-1"></i> Keluar
      </button>
    </div>
  </nav>

  <div class="container py-5">
    <h3 class="fw-bold mb-4">Daftar Pengaduan Masyarakat & Balasan</h3>
    
    <div class="table-responsive bg-white rounded shadow-sm p-3">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID Token</th>
            <th>Nama & Kontak</th>
            <th>Isi Pengaduan</th>
            <th>Status</th>
            <th>Balasan Admin (Ketik di sini)</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelAduanAdmin">
          <!-- Otomatis diisi oleh JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script>
    // Langsung muat tabel aduan saat halaman admin dibuka
    window.onload = function() {
      renderTabelAdmin();
    };
  </script>
</body>
</html>
