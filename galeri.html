<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Desa Semparuk Sebangkau - Kab. Sambas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <nav class="bg-emerald-700 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <span class="text-xl md:text-2xl font-bold">Desa Semparuk Sebangkau</span>
            <div class="space-x-4 text-sm md:text-base">
                <a href="index.html" class="hover:underline">Beranda</a>
                <a href="profil.html" class="hover:underline">Profil</a>
                <a href="sejarah.html" class="hover:underline">Sejarah</a>
                <a href="potensi.html" class="hover:underline">Potensi</a>
                <a href="galeri.html" class="hover:underline font-bold text-yellow-300">Galeri</a>
                <a href="kontak.html" class="hover:underline">Kontak</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 flex-grow">
        <h2 class="text-3xl font-bold text-emerald-800 mb-6 text-center">Sudut Lingkungan Semparuk Sebangkau</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            
            <div class="bg-white rounded-lg shadow overflow-hidden border border-slate-200 cursor-pointer transition transform hover:scale-105" onclick="openModal('jalan.jpg')">
                <img src="jalan.jpg" alt="Jalan Desa Semparuk Sebangkau" class="w-full h-48 object-cover">
                <div class="p-4"><p class="font-bold text-gray-800">Infrastruktur Jalan Desa</p></div>
            </div>
            
            <div class="bg-white rounded-lg shadow overflow-hidden border border-slate-200 cursor-pointer transition transform hover:scale-105" onclick="openModal('sungai.jpg')">
                <img src="sungai.jpg" alt="Sungai Sebangkau" class="w-full h-48 object-cover">
                <div class="p-4"><p class="font-bold text-gray-800">Kawasan Perairan Sungai</p></div>
            </div>
            
            <div class="bg-white rounded-lg shadow overflow-hidden border border-slate-200 cursor-pointer transition transform hover:scale-105" onclick="openModal('sunset.jpg')">
                <img src="sunset.jpg" alt="Pemandangan Sunset Desa" class="w-full h-48 object-cover">
                <div class="p-4"><p class="font-bold text-gray-800">Pemandangan Matahari Terbenam</p></div>
            </div>

        </div>

        <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-80 hidden z-50 flex justify-center items-center p-4" onclick="closeModal()">
            <div class="relative max-w-4xl w-full flex justify-center">
                <img id="modalImg" src="" class="max-h-[85vh] max-w-full rounded-lg shadow-2xl object-contain">
                <span class="absolute top-2 right-4 text-white text-3xl font-bold cursor-pointer bg-black bg-opacity-50 px-3 py-1 rounded-full">&times;</span>
            </div>
        </div>
    </main>

    <script>
        function openModal(imageSrc) {
            document.getElementById('modalImg').src = imageSrc;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }
    </script>

    <footer class="bg-slate-800 text-white p-4 text-center text-sm">
        <p>&copy; 2026 Desa Semparuk Sebangkau, Kabupaten Sambas. All Rights Reserved.</p>
    </footer>
</body>
</html>
